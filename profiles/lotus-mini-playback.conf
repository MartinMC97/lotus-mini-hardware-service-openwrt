# Staged output-only profile, not installed as /etc/asound.conf.
# The shared output uses the already validated softvol control and safety route.
</usr/share/alsa/alsa.conf>
defaults.pcm.rate_converter "linear"
pcm.lotus_playback {
    type plug
    slave { pcm "lotus_volume" format S16_LE rate 48000 channels 2 }
}
pcm.lotus_volume {
    type softvol
    slave.pcm "lotus_quiet"
    control { name "HA Volume" card "LotusMini" }
    min_dB -40.0
    max_dB 0.0
}
pcm.lotus_quiet {
    type route
    slave { pcm "hw:LotusMini,0" format S16_LE channels 2 }
    ttable.0.0 0.15
    ttable.1.1 0.15
}
